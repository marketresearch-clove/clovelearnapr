name = "skill-spire-ollama-proxy"
type = "service"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[env.production]
routes = [
  { pattern = "https://ollama-proxy.clovetech.workers.dev/*", zone_name = "clovetech.com" }
]

[[env.production.kv_namespaces]]
binding = "OLLAMA_CACHE"
id = "your-kv-namespace-id"

[env.development]
